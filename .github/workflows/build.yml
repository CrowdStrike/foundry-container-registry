name: npm

on:
  pull_request:
    paths:
      - 'ui/pages/**'
  push:
    branches:
      - main
    paths:
      - 'ui/pages/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
    WORKDIR: "./ui/pages/"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run make build
        run: |
          make build
